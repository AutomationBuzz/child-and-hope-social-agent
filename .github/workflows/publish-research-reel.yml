name: CHILD & HOPE - Publish Reviewed Research Reel

on:
  workflow_dispatch:
    inputs:
      reel_run_id:
        description: "Run ID of the reviewed Research Reel Draft workflow artifact"
        required: true
        type: string
      confirm_publish:
        description: "Choose yes only after reviewing the Reel, source, caption, and hashtags"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  actions: read
  contents: read

concurrency:
  group: child-hope-research-reel-publish
  cancel-in-progress: false

jobs:
  publish-reviewed-reel:
    if: ${{ inputs.confirm_publish == 'yes' }}
    runs-on: ubuntu-latest
    environment: facebook-production
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download reviewed Reel artifact
        uses: actions/download-artifact@v4
        with:
          name: child-hope-research-reel-draft
          run-id: ${{ inputs.reel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-artifact
      - name: Publish reviewed Reel to Facebook
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          EXPECTED_FB_PAGE_ID: "1345909531941708"
          FB_GRAPH_VERSION: "v23.0"
        run: python src/publish_research_reel.py
      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-hope-research-reel-publication-receipt
          path: facebook_reel_publication_receipt.md
          if-no-files-found: ignore
          retention-days: 90
  skipped-without-confirmation:
    if: ${{ inputs.confirm_publish != 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Keep publication disabled
        run: echo "Publication was not confirmed. No Facebook Reel was published."
