name: CHILD & HOPE Pipeline Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "content/**"
      - "requirements.txt"
      - ".github/workflows/facebook-agent.yml"
  schedule:
    - cron: "0 14 * * *" # daily at 14:00 UTC until the 48-hour campaign window is configured

permissions:
  contents: read

concurrency:
  group: child-hope-facebook-pipeline
  cancel-in-progress: false

jobs:
  pipeline-agent:
    runs-on: ubuntu-latest
    environment: facebook-production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src

      - name: Run pipeline agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          EXPECTED_FB_PAGE_ID: ${{ vars.EXPECTED_FB_PAGE_ID }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          APPROVED_CONTENT_SHA256: ${{ vars.APPROVED_CONTENT_SHA256 }}
        run: python src/pipeline_agent.py

      - name: Upload diagnostics and draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-and-hope-diagnostics-and-draft
          path: |
            troubleshooting_report.md
            draft_caption.txt
          if-no-files-found: ignore
          retention-days: 7
