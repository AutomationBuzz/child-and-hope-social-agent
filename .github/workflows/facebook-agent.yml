name: CHILD & HOPE Facebook Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *" # daily at 14:00 UTC for now

permissions:
  contents: read

concurrency:
  group: child-hope-facebook-publisher
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    environment: facebook-production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate runtime configuration (never prints secrets)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          EXPECTED_FB_PAGE_ID: ${{ vars.EXPECTED_FB_PAGE_ID }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          APPROVED_CONTENT_SHA256: ${{ vars.APPROVED_CONTENT_SHA256 }}
        run: python src/validate_config.py

      - name: Generate draft and publish only if every gate passes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          EXPECTED_FB_PAGE_ID: ${{ vars.EXPECTED_FB_PAGE_ID }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          APPROVED_CONTENT_SHA256: ${{ vars.APPROVED_CONTENT_SHA256 }}
        run: python src/agent.py

      - name: Upload draft for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-and-hope-facebook-draft
          path: draft_caption.txt
          if-no-files-found: ignore
          retention-days: 7
